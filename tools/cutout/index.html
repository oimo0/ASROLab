<!doctype html>
<html lang="ja" data-bg="grid">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f6f8" />
  <meta name="description" content="画像を外部へ送信せず、端末内AIで高品質に背景を透明化するASRO Labツール。" />
  <title>ASRO Cutout | ASRO Lab</title>
  <link rel="stylesheet" href="./style.css?v=5" />
  <script type="module" src="../../shared/lab-header.js"></script>
  <script type="module" src="./app.js?v=7"></script>
</head>
<body>
  <lab-header tool-name="ASRO Cutout"></lab-header>

  <main class="shell">
    <section class="hero" data-hero>
      <div class="eyebrow"><span class="live-dot"></span> ON-DEVICE AI</div>
      <h1>背景だけ、<span>きれいに消す。</span></h1>
      <p>画像は外部に送らず、この端末の中だけで処理します。</p>
    </section>

    <section class="app-card" aria-label="背景透明化ツール">
      <div class="drop-zone" data-drop-zone>
        <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/avif" hidden />
        <div class="drop-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
        </div>
        <h2>画像を選ぶ</h2>
        <p>タップして画像を選択</p>
        <button class="primary-button" type="button" data-pick>画像を選ぶ</button>
        <small>JPEG / PNG / WebP / AVIF</small>
      </div>

      <div class="workspace" data-workspace hidden>
        <section class="preview-panel">
          <div class="preview-head">
            <div class="preview-label">
              <span class="state-dot"></span>
              <strong data-result-state>元画像</strong>
            </div>
            <button class="change-button" type="button" data-change-image>画像を変更</button>
          </div>

          <div class="preview-toolbar" data-preview-toolbar hidden>
            <div class="segmented" data-view-switch hidden role="group" aria-label="プレビュー切り替え">
              <button class="active" type="button" data-view="result">透過結果</button>
              <button type="button" data-view="original">元画像</button>
            </div>
            <div class="bg-switch" data-bg-switch hidden role="group" aria-label="プレビュー背景">
              <button class="active" type="button" data-bg-choice="grid" aria-label="チェック柄"></button>
              <button type="button" data-bg-choice="light" aria-label="白背景"></button>
              <button type="button" data-bg-choice="dark" aria-label="黒背景"></button>
            </div>
          </div>

          <div class="image-stage" data-stage>
            <img data-preview alt="処理する画像のプレビュー" />
            <div class="processing-overlay" data-processing hidden>
              <div class="spinner" aria-hidden="true"></div>
              <strong data-status-title>AIを準備しています</strong>
              <span data-status-detail>初回はAIモデルを読み込みます</span>
              <div class="progress-track"><i data-progress></i></div>
            </div>
          </div>

          <div class="image-summary">
            <div class="summary-file">
              <span data-file-name>—</span>
            </div>
            <span class="summary-sep">•</span>
            <span data-resolution>—</span>
            <span class="summary-sep">•</span>
            <span data-engine>未処理</span>
          </div>
        </section>

        <aside class="control-panel">
          <div class="control-actions">
            <button class="run-button" type="button" data-run>
              <span data-run-label>背景を透明化</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <button class="download-button" type="button" data-download hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
              透過PNGを保存
            </button>
          </div>

          <label class="field edge-field" data-edge-field hidden>
            <span class="field-line"><span>輪郭</span><output data-edge-value>自然</output></span>
            <input data-edge type="range" min="0" max="100" value="50" />
            <small>切り抜き結果の輪郭だけを調整します。</small>
          </label>

          <details class="advanced">
            <summary>詳細設定</summary>
            <div class="advanced-body">
              <label class="field">
                <span>AI品質</span>
                <select data-quality>
                  <option value="auto">自動（おすすめ）</option>
                  <option value="high">最高品質 1024px</option>
                  <option value="standard">標準 512px</option>
                </select>
                <small data-quality-note>端末に合わせて自動で選びます。</small>
              </label>

              <div class="device-card">
                <span class="device-icon" aria-hidden="true">AI</span>
                <div>
                  <strong data-device-title>端末を確認中</strong>
                  <small data-device-detail>処理方式を判定しています</small>
                </div>
              </div>
            </div>
          </details>

          <p class="privacy-note"><span aria-hidden="true">●</span>画像はアップロードされません。AI処理はこの端末内で行われます。</p>
        </aside>
      </div>
    </section>

    <section class="mini-info" aria-label="特徴">
      <span>端末内AI</span><span>元解像度PNG</span><span>画像アップロードなし</span>
    </section>

    <p class="model-credit">BiRefNet · 初回のみAIモデルの取得が必要です。</p>
  </main>
</body>
</html>
